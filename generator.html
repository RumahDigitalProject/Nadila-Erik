<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buat Link Undangan - Nadila & Erik 💌</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #ffffff; /* Full warna putih bersih */
      color: #333333; /* Teks diubah ke gelap agar terbaca */
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .generator {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); /* Bayangan dibuat lebih lembut */
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-family: "Great Vibes", cursive;
      font-size: 38px;
      margin-bottom: 20px;
      color: #7b1f26; /* Judul burgundy senada dengan tema undangan */
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #cccccc;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      outline: none;
      background: #f9f9f9;
      color: #333333;
    }

    input:focus {
      border-color: #f3a302;
    }

    button {
      background-color: #f3a302;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background-color: #d48c00;
    }

    .hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 10px;
      word-break: break-all;
      border: 1px solid #e0e0e0;
    }

    .hasil p {
      margin-top: 0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    a.link {
      color: #0056b3;
      text-decoration: underline;
      word-break: break-all;
      font-weight: 500;
    }

    .btn-wa {
      display: inline-block;
      background-color: #25D366;
      color: white;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
      transition: background 0.3s;
    }

    .btn-wa:hover {
      background-color: #1ea955;
    }
  </style>
</head>
<body>
  <div class="generator">
    <h1>Buat Link Undangan 💌</h1>
    <p>Masukkan nama tamu undangan di bawah ini:</p>

    <input type="text" id="namaTamu" placeholder="Contoh: Bapak Andi & Keluarga" />
    <button id="buatLink">Buat Link</button>

    <div class="hasil" id="hasil" style="display:none;">
      <p>Link undangan siap dikirim:</p>
      <a id="linkUndangan" class="link" href="#" target="_blank"></a>
      <br />
      <a id="btnKirimWa" class="btn-wa" href="#" target="_blank">
        📩 Kirim via WhatsApp
      </a>
    </div>
  </div>

<script>
  // 🏠 URL undangan utama (Disesuaikan untuk project Nadila & Erik)
  const baseUrl = "https://rumahdigitalproject.github.io/Nadila-Erik/";

  document.getElementById("buatLink").addEventListener("click", () => {
    const nama = document.getElementById("namaTamu").value.trim();
    if (!nama) {
      alert("Masukkan nama tamu dulu ya! 😊");
      return;
    }

    // Buat link undangan (sudah di-encode untuk parameter)
    const encodedName = encodeURIComponent(nama);
    const link = `${baseUrl}?to=${encodedName}`;

    // Tampilkan link hasil
    const hasilDiv = document.getElementById("hasil");
    const linkEl = document.getElementById("linkUndangan");
    const btnWa = document.getElementById("btnKirimWa");

    hasilDiv.style.display = "block";
    linkEl.href = link;
    linkEl.textContent = link;

    // --- Pesan WA Bernuansa Islam ---
    const plainPesan = `Assalamu'alaikum Warahmatullahi Wabarakatuh\n\n` +
      `Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i *${nama}* ` +
      `untuk menghadiri dan memberikan doa restu pada acara pernikahan kami:\n\n` +
      ` *Nadila & Erik* \n\n` +
      `insyaAllah akan diselenggarakan pada:\n` +
      `Hari/Tanggal: *Selasa, 3 November 2026*\n\n` +
      `Untuk informasi detail acara dan konfirmasi kehadiran, silakan klik tautan di bawah ini:\n${link}\n\n` +
      `_(Saran: Buka tautan via Google Chrome agar tampilan lebih maksimal)._\n\n` +
      `Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\n` +
      `Terima kasih atas perhatian dan doa restunya.\n\n` +
      `Wassalamu'alaikum Warahmatullahi Wabarakatuh`;

    // Encode seluruh pesan agar aman dimasukkan ke query string WhatsApp
    const waUrl = `https://wa.me/?text=${encodeURIComponent(plainPesan)}`;

    // Set atribut tombol WhatsApp
    btnWa.href = waUrl;
    btnWa.setAttribute('rel', 'noopener noreferrer');
    btnWa.setAttribute('target', '_blank');
  });
</script>
</body>
</html>
